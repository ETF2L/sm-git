// Settings of the git extension, read when it loads. Every setting is
// optional; the values here are the defaults.
"Git"
{
	// Where the repositories are kept, as bare clones at <host>/<path>.git.
	// Relative to the game directory, or absolute. Several servers may share
	// one directory. Empty: addons/sourcemod/data/git.
	"root"              ""

	// A file of CA certificates (PEM) to trust besides the shipped
	// configs/git/ca-bundle.crt, for git servers with a private CA. Relative
	// to the game directory, or absolute.
	"ca_file"           ""

	// Seconds between the fetches of a watched repository, when the plugin
	// names none. At least 60.
	"watch_interval"    "300"

	// Seconds to reach a remote, and seconds a remote may send nothing. At
	// most 3600 each.
	"connect_timeout"   "10"
	"stall_timeout"     "30"

	// A clone or fetch that would make a repository larger than this many
	// megabytes is aborted.
	"max_size_mb"       "200"
}
